name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  guard:
    name: Deploy workflow is manual only
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Check aws.yml triggers
      run: tests/deploy-workflow-is-manual.sh
